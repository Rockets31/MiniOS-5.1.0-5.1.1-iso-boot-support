# MiniOS
# https://minios.dev/

iso_pattern1="minios-trixie-xfce-*-amd64-5.1.0.iso"
iso_pattern2="minios-trixie-xfce-*-amd64-5.1.1.iso"

for isofile in ($dev,*)$iso_dir/$iso_pattern1 ($dev,*)$iso_dir/$iso_pattern2; do
	if [ -e "$isofile" ]; then
		regexp --set=isoname "$iso_dir/(.*)" "$isofile"

      submenu "$isoname [scandev] ->" "$isofile" "$iso_dir/$isoname" {
			iso_path="$3"
			LOOPBACK "$2"
			addon="/MultiOS-USB/config_priv/minios-sc/minios510.img"

menuentry "Resume previous session" --class resume {
    #echo $message
    #search --set -f (loop)/minios/boot/vmlinuz
    #set gfxpayload=$gfxpayload
    linux (loop)/minios/boot/vmlinuz rdinit=/isomount findiso=$iso_path boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 nottyautologin perchdir=resume
    initrd (loop)/minios/boot/initrfs.img "$addon"
}
menuentry "Start a new session" --class new {
    #echo $message
    #search --set -f (loop)/minios/boot/vmlinuz
    #set gfxpayload=$gfxpayload
    linux (loop)/minios/boot/vmlinuz rdinit=/isomount findiso=$iso_path boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 nottyautologin perchdir=new
    initrd (loop)/minios/boot/initrfs.img "$addon"
}
menuentry "Choose session during startup" --class switch {
    #echo $message
    #search --set -f (loop)/minios/boot/vmlinuz
    #set gfxpayload=$gfxpayload
    linux (loop)/minios/boot/vmlinuz rdinit=/isomount findiso=$iso_path boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 nottyautologin perchdir=ask
    initrd (loop)/minios/boot/initrfs.img "$addon"
}
menuentry "Fresh start" --class live {
    #echo $message
    #search --set -f (loop)/minios/boot/vmlinuz
    #set gfxpayload=$gfxpayload
    linux (loop)/minios/boot/vmlinuz rdinit=/isomount findiso=$iso_path boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 nottyautologin
    initrd (loop)/minios/boot/initrfs.img "$addon"
}
menuentry "Copy to RAM" --class ram {
    #echo $message
    #search --set -f (loop)/minios/boot/vmlinuz
    #set gfxpayload=$gfxpayload
    linux (loop)/minios/boot/vmlinuz rdinit=/isomount findiso=$iso_path boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 nottyautologin toram
    initrd (loop)/minios/boot/initrfs.img "$addon"
}
}
fi
done
